
name: Energy Data Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Check Python syntax
        run: |
          python -m compileall -q ingestion transformation airflow/dags

      - name: Check Python code quality
        run: |
          ruff check ingestion transformation airflow/dags \
            --select E4,E7,E9,F63,F7,F82

  dbt-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dbt
        run: pip install dbt-core dbt-redshift

      - name: Validate dbt project
        working-directory: dbt/energy_analytics
        run: |
          dbt parse --profiles-dir .
        env:
          DBT_PROFILES_DIR: .
