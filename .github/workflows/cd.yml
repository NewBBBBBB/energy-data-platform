
name: Deploy AWS Glue Script

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Glue script to S3
        run: |
          aws s3 cp \
            transformation/silver/demand_transformation.py \
            s3://aws-glue-assets-755332618937-us-east-1/scripts/eia-demand-bronze-to-silver.py

      - name: Debug OIDC identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('Audience:', payload.aud);
            console.log('Subject:', payload.sub);
            console.log('Issuer:', payload.iss);